baseURL = 'https://dylanwgroves.com/'
locale = 'en-us'
title = 'Dylan W. Groves'
theme = 'minimal'

# No tag/category browsing pages on this site; `tags` in blog front matter is
# kept as metadata only. This empty table disables Hugo's default taxonomies
# and the "found no layout file for kind taxonomy/term" build warnings.
[taxonomies]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  affiliation = 'Assistant Professor of Government and Law, Lafayette College'

[menu]
  [[menu.main]]
    name = 'about'
    url = '/'
    weight = 1
  [[menu.main]]
    name = 'research'
    url = '/research/'
    weight = 2
  [[menu.main]]
    name = 'teaching'
    url = '/teaching/'
    weight = 3
  [[menu.main]]
    name = 'cv'
    url = '/cv/'
    weight = 4
