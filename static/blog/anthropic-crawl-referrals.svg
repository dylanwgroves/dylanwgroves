<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" role="img" aria-label="Bar chart: number of crawl requests per web traffic referral. Anthropic 2,800; OpenAI 331; Perplexity 211; Microsoft 35; Google 5; DuckDuckGo 3. Source: Cloudflare, July 1 to 7, 2026.">
  <text x="0" y="24" font-size="19" font-weight="700" fill="#111111">Number of crawl requests per web traffic referral</text>

  <!-- Anthropic -->
  <text x="138" y="66" font-size="14" fill="#333333" text-anchor="end" dominant-baseline="middle">Anthropic</text>
  <rect x="150" y="55" width="440" height="22" fill="#2f6bff"/>
  <text x="598" y="66" font-size="13" font-weight="600" fill="#333333" dominant-baseline="middle">2,800</text>

  <!-- OpenAI -->
  <text x="138" y="108" font-size="14" fill="#333333" text-anchor="end" dominant-baseline="middle">OpenAI</text>
  <rect x="150" y="97" width="52" height="22" fill="#2f6bff"/>
  <text x="210" y="108" font-size="13" fill="#333333" dominant-baseline="middle">331</text>

  <!-- Perplexity -->
  <text x="138" y="150" font-size="14" fill="#333333" text-anchor="end" dominant-baseline="middle">Perplexity</text>
  <rect x="150" y="139" width="33" height="22" fill="#2f6bff"/>
  <text x="191" y="150" font-size="13" fill="#333333" dominant-baseline="middle">211</text>

  <!-- Microsoft -->
  <text x="138" y="192" font-size="14" fill="#333333" text-anchor="end" dominant-baseline="middle">Microsoft</text>
  <rect x="150" y="181" width="6" height="22" fill="#2f6bff"/>
  <text x="164" y="192" font-size="13" fill="#333333" dominant-baseline="middle">35</text>

  <!-- Google -->
  <text x="138" y="234" font-size="14" fill="#333333" text-anchor="end" dominant-baseline="middle">Google</text>
  <rect x="150" y="223" width="2" height="22" fill="#2f6bff"/>
  <text x="160" y="234" font-size="13" fill="#333333" dominant-baseline="middle">5</text>

  <!-- DuckDuckGo -->
  <text x="138" y="276" font-size="14" fill="#333333" text-anchor="end" dominant-baseline="middle">DuckDuckGo</text>
  <rect x="150" y="265" width="2" height="22" fill="#2f6bff"/>
  <text x="160" y="276" font-size="13" fill="#333333" dominant-baseline="middle">3</text>

  <text x="0" y="330" font-size="12" fill="#666666">Note: Figures show web (non-native-app) activity from July 1 through July 7, 2026.  ·  Source: Cloudflare</text>
</svg>
